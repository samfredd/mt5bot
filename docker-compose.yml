services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mt5bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mt5bot}
      POSTGRES_DB: mt5bot
    # Host port 5433 to avoid clashing with any local Postgres on 5432.
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt5bot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    profiles: ["ai"]

  mt5-bridge:
    build: ./mt5-bridge
    restart: unless-stopped
    profiles: ["mock"]
    environment:
      MT5_MOCK: "true"
      # Development mock only. Production uses docker-compose.windows-mt5.yml
      # with a mounted Windows-host secret file.
      BRIDGE_API_KEY: change-me-bridge-key
    ports: ["5001:5001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://localhost:5001/health',headers={'x-api-key':os.environ['BRIDGE_API_KEY']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Local-development bootstrap only. Production must mount unique secrets
      # via its platform secret manager; see docs/DEPLOYMENT.md.
      NODE_ENV: development
      JWT_SECRET: local-development-only-jwt-secret-change-before-production
      CREDENTIALS_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql://mt5bot:${POSTGRES_PASSWORD:-mt5bot}@postgres:5432/mt5bot
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://ollama:11434}
    extra_hosts:
      # Lets the container reach the bridge attached to the existing macOS
      # MetaTrader/Wine terminal. The actual URL and key live in DB Settings.
      - "host.docker.internal:host-gateway"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  ollama:
